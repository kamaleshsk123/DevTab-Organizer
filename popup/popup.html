<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevTab Organizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">

    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M19 4H5C3.89543 4 3 4.89543 3 6V18C3 19.1046 3.89543 20 5 20H19C20.1046 20 21 19.1046 21 18V6C21 4.89543 20.1046 4 19 4Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M3 10H21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M9 4V10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M15 4V10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <h1>DevTab</h1>
      </div>
      <div class="header-actions">
        <label class="toggle-switch" title="Toggle Auto-Grouping">
          <input type="checkbox" id="auto-group-toggle">
          <span class="slider"></span>
        </label>
        <span class="toggle-label">Auto</span>
        <a href="settings.html" id="btn-settings" class="btn-icon-only" title="Custom Domain Rules (Settings)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </a>
      </div>
    </header>

    <!-- Search Bar -->
    <div class="search-bar-wrapper">
      <div class="search-bar">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" placeholder="Search open tabs..." autocomplete="off" spellcheck="false">
        <button id="search-clear" class="search-clear" title="Clear search" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" width="12" height="12">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <!-- Search Results Drop-down -->
      <div id="search-results" class="search-results" style="display:none;"></div>
    </div>

    <!-- Main Content Grid -->
    <main class="app-main" id="app-main">

      <!-- Stats Dashboard -->
      <section class="stats-dashboard">
        <div class="main-stat">
          <span class="stat-number" id="total-tabs-count">0</span>
          <span class="stat-label">Active Tabs</span>
        </div>
        <div class="category-grid" id="category-grid">
          <!-- Dynamic category chips injected here -->
        </div>
      </section>

      <!-- Primary Action Controls -->
      <section class="action-controls">
        <button id="btn-group-all" class="btn btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="btn-icon">
            <path d="M4 6H20M4 12H20M4 18H20" stroke-linecap="round"/>
          </svg>
          <span id="btn-group-label">Group All Tabs</span>
          <span class="spinner" id="group-spinner" style="display:none;"></span>
        </button>

        <div class="save-session-box">
          <input type="text" id="session-name-input" placeholder="Name current session..." maxlength="30">
          <button id="btn-save-session" class="btn btn-secondary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="btn-icon">
              <path d="M19 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H16L21 8V19C21 19.5304 20.7893 20.0391 20.4142 20.4142C20.0391 20.7893 19.5304 21 19 21Z"/>
              <path d="M17 21V13H7V21"/>
              <path d="M7 3V8H15"/>
            </svg>
            Save
          </button>
        </div>
      </section>

      <!-- Sessions List -->
      <section class="sessions-section">
        <div class="sessions-header-row">
          <h3>Saved Sessions</h3>
        </div>
        <div class="sessions-list" id="sessions-list">
          <div class="no-sessions">No saved sessions yet.</div>
        </div>
      </section>

    </main>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <script src="mock.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
